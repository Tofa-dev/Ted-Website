<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Work — Ted Oladele</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #ff3b30;
      --text: #111;
      --muted: #777;
      --bg: #f7f7f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Playfair Display', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
      padding: 0;
      margin: 0;
      max-width: none;
    }

    /* Sidebar */
    .sidebar {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 24px 20px;
      align-self: start;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .sidebar a {
      color: #111;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .sidebar a.active,
    .sidebar a:hover {
      color: var(--red);
    }

    .sidebar-footer {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #111;
    }
    /* Work list */
    .content {
      max-width: 700px;
      padding-top: 24px;
    }

    .work-item {
      margin-bottom: 22px;
      font-size: 18px;
      font-weight: 500;
    }

    .work-item a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s ease;
    }

    .work-item a:hover {
      color: var(--red);
    }

    .arrow {
      font-size: 14px;
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        padding: 24px 20px;
      }

      .sidebar-footer {
        position: static;
        margin-top: 60px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <a href="work.html" class="active">Work</a>
        <a href="#">Thoughts</a>
        <a href="projects.html">Projects</a>
        <a href="#">Career</a>
        <a href="#">On the Internet</a>
      </nav>

      <div class="sidebar-footer">
        <a href="projects.html">TED OLADELE</a>
      </div>
    </aside>

    <!-- Content -->
    <main class="content">

      <div class="work-item">
        <a href="#">
          Flutterwave’s Brand Refresh <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          Flutterwave dashboard v3 <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          2 years of product leadership <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          Flutterwave store <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          The first 20. <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          Growth, History, Impact and Scale. <span class="arrow">↗</span>
        </a>
      </div>

      <div class="work-item">
        <a href="#">
          What Collaboration looks like at FLWD <span class="arrow">↗</span>
        </a>
      </div>

    </main>

  </div>

</body>
</html>
